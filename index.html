<style>
/* === Reset & Base === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0d0d0d;
  color: #ccc;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 16px;
}
#app {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* === Typography === */
h1, h2, h3 { font-family: "Times New Roman", "Songti SC", "SimSun", serif; }
h1 { font-size: 32px; color: #c9a84c; letter-spacing: 6px; text-align: center; }
h2 { font-size: 22px; color: #c9a84c; margin-bottom: 12px; }
h3 { font-size: 16px; color: #c9a84c; margin-bottom: 8px; }
.subtitle { font-size: 13px; color: #666; margin-bottom: 20px; text-align: center; }

/* === Cards === */
.card {
  background: #1a1a2e;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: border-color 0.2s;
  touch-action: manipulation;
}
.card:hover, .card.selected { border-color: #c9a84c; }
.card.selected { box-shadow: 0 0 8px rgba(201,168,76,0.3); }
.card.disabled { opacity: 0.4; pointer-events: none; }

/* === Card Grid === */
.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card-grid.single-col { grid-template-columns: 1fr; }

/* === Buttons === */
.btn {
  display: block; width: 100%; padding: 14px;
  border: 1px solid #c9a84c; border-radius: 8px;
  background: transparent; color: #c9a84c;
  font-size: 16px; font-family: "Times New Roman", serif;
  cursor: pointer; text-align: center; margin-bottom: 10px;
  transition: background 0.2s, color 0.2s;
}
.btn:hover { background: #c9a84c; color: #0d0d0d; }
.btn.primary { background: #c9a84c; color: #0d0d0d; }
.btn.secondary { border-color: #555; color: #888; }
.btn.secondary:hover { background: #555; color: #fff; }
.btn.danger { border-color: #c41e3a; color: #c41e3a; }
.btn.danger:hover { background: #c41e3a; color: #fff; }
.btn:disabled { opacity: 0.3; pointer-events: none; }

/* === Attribute Row === */
.attr-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid #1a1a2e;
}
.attr-name { font-size: 14px; color: #ccc; }
.attr-value { font-size: 14px; color: #c9a84c; font-weight: bold; }
.attr-controls { display: flex; gap: 8px; align-items: center; }
.attr-btn {
  width: 32px; height: 32px; border: 1px solid #555; border-radius: 4px;
  background: transparent; color: #ccc; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.attr-btn:hover { border-color: #c9a84c; color: #c9a84c; }
.attr-btn:disabled { opacity: 0.2; pointer-events: none; }

/* === Tags === */
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 11px; margin-right: 4px;
}
.tag-positive { background: #1a3a1a; color: #4caf50; border: 1px solid #2a5a2a; }
.tag-negative { background: #3a1a1a; color: #f44336; border: 1px solid #5a2a2a; }
.tag-gold { background: #2a2a1a; color: #c9a84c; border: 1px solid #4a4a2a; }
.tag-locked { background: #1a1a1a; color: #666; border: 1px solid #333; }

/* Talent rarity tags */
.tag-legendary { background: #2a1a0a; color: #ff8c00; border: 1px solid #5a3a1a; }
.tag-epic { background: #1a0a2a; color: #b44dff; border: 1px solid #3a1a5a; }
.tag-rare { background: #0a1a2a; color: #4da6ff; border: 1px solid #1a3a5a; }
.tag-cursed { background: #3a0a0a; color: #ff4444; border: 1px solid #5a1a1a; }

/* === Narrative Box === */
.narrative {
  background: #1a1a2e; border-left: 3px solid #c9a84c;
  padding: 16px; border-radius: 4px; margin-bottom: 16px;
  font-style: italic; font-size: 14px; line-height: 1.7;
}

/* === Progress Bar === */
.progress-bar {
  width: 100%; height: 4px; background: #1a1a2e; border-radius: 2px;
  margin-bottom: 16px;
}
.progress-fill { height: 100%; background: #c9a84c; border-radius: 2px; transition: width 0.3s; }

/* === Footer Info === */
.stage-info {
  display: flex; justify-content: space-between;
  font-size: 12px; color: #666; margin-bottom: 12px;
}

/* === Options List === */
.option-item {
  background: #1a1a2e; border: 1px solid #2a2a2a; border-radius: 6px;
  padding: 12px; margin-bottom: 8px; cursor: pointer;
  transition: border-color 0.2s;
}
.option-item:hover { border-color: #c9a84c; }
.option-item.locked { opacity: 0.5; cursor: not-allowed; border-color: #333; }
.option-text { font-size: 14px; margin-bottom: 4px; }
.option-effects { font-size: 12px; }
.effect-pos { color: #4caf50; }
.effect-neg { color: #f44336; }
.effect-neutral { color: #888; }

/* === Reroll Button === */
.reroll-info { text-align: center; font-size: 13px; color: #888; margin: 8px 0; }

/* === History List === */
.history-item {
  background: #1a1a2e; border: 1px solid #2a2a2a; border-radius: 8px;
  padding: 12px; margin-bottom: 8px;
}
.history-title { font-size: 16px; color: #c9a84c; }
.history-meta { font-size: 12px; color: #666; margin-top: 4px; }

/* === Scrollable content === */
.screen-content { flex: 1; overflow-y: auto; padding-bottom: 20px; }

/* === Score display === */
.score-badge {
  display: inline-block; padding: 4px 12px; border-radius: 4px;
  font-size: 13px; font-weight: bold;
}
.score-SS { background: #c9a84c; color: #0d0d0d; }
.score-S  { background: #d4a574; color: #0d0d0d; }
.score-A  { background: #4caf50; color: #fff; }
.score-B  { background: #2196f3; color: #fff; }
.score-C  { background: #ff9800; color: #fff; }
.score-D  { background: #f44336; color: #fff; }

/* === Ending Screen === */
.ending-header { text-align: center; margin-bottom: 24px; }
.ending-title { font-size: 28px; color: #c9a84c; letter-spacing: 4px; margin-bottom: 8px; }
.ending-grade { font-size: 64px; color: #c9a84c; margin: 16px 0; text-align: center; }
.ending-narrative {
  background: #1a1a2e; border-radius: 8px; padding: 16px;
  font-style: italic; line-height: 1.8; text-align: center; margin-bottom: 20px;
}
/* === Share === */
.share-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 200; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px;
}
.share-overlay.active { display: flex; }
.share-card-img {
  max-width: 90vw; max-height: 70vh;
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(201,168,76,0.25);
  object-fit: contain;
}
.share-hint {
  color: #ccc; font-size: 14px; margin-top: 16px;
  text-align: center; opacity: 0.85;
}
.share-close {
  color: #ccc; background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.25); padding: 10px 32px;
  border-radius: 24px; font-size: 15px; cursor: pointer; margin-top: 16px;
}
.btn-share {
  background: none; color: #888;
  border: 1.5px dashed #555;
  padding: 10px 16px; border-radius: 14px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: transform 0.15s;
  width: 100%; margin-bottom: 10px;
}
.btn-share:active { transform: scale(0.95); }
.btn-share:hover { border-color: #888; color: #ccc; }



@media (max-width: 374px) {
  body { padding: 8px; }
  h1 { font-size: 24px; }
  .card { padding: 12px; }
}
</style>

      { text: '支持他追梦', require: {}, effects: { 道德: 10, 财富: -500 }, narrative: '你从怀里掏出一个沉甸甸的钱袋，放在她手心。"路上小心，写信回来。"她扑上来抱着你哭了一场。送别那天，你站在山头一直看，直到她的身影消失在地平线尽头。你知道她可能会摔跟头——但你也知道，不让她去的代价，比任何摔倒都要沉重。' },
      { text: '让他走你安排的路', require: { 声望: 200 }, effects: { 声望: 20, 道德: -5 }, narrative: '你动用了所有人脉为他在王都谋了一份安稳的差事。他没有反抗，乖乖去了。但每次回家，他脸上那副淡淡的、得体又疏离的微笑让你心里不是滋味。你给的不是他想要的——但也许在未来的某一天，他会感激你的安排。你想这样安慰自己。' },
    ],
  },

      { text: '著书传世', require: { 智慧: 100 }, effects: { 智慧: 5, 声望: 50 }, narrative: '你用三年时间写了一部巨著，把你的一切都写在了纸上。这本书后来成了大陆上每一所学院的必读教材。你的手稿被保存在王都大图书馆最深处的展厅里，放在玻璃柜中，旁边写着你的名字和生卒年份。' },

  {

      { text: '婉拒', require: {}, effects: { 声望: -10 }, narrative: '你写了一份得体的回信，以年事已高为由婉拒了国王的邀请。有人说你傲慢，有人说你不识抬举。但你没有解释——因为你明白，王位边的椅子从来就不舒服。你宁愿在自家院子里晒太阳。' },

  {

      { text: '默默怀念', require: {}, effects: { 道德: 5 }, narrative: '你在老槐树下坐了一个下午，看日影缓缓西移。没有大肆修建，没有大张旗鼓，只是静静地怀念。然后你拍拍身上的土，起身离开了。有些东西不需要被归还——能被记忆，已是最好不过。' },

  // ===== 老年 =====
  {

    narrative: '黄昏的山顶上，你坐在一块被夕阳烧得火红的岩石上，俯瞰着脚下的大地。你在想象：如果就这样长眠于此，会不会是最好的告别？不——你还不想告别。你还有最后一座山峰没有征服，最后一个遗憾没有填补。你的骨头在作痛，但你的心依然在敲着冒险的鼓点。',

      { text: '安享晚年', require: {}, effects: { 体质: 5, 运气: 10, 财富: -100 }, narrative: '你把最后的日子花在了最值得的事情上：每天早晨沏一壶好茶，坐在门口晒晒太阳，看着村里的孩子们跑来跑去。有时候给他们讲一两个从前的故事——不讲那些太吓人的，只讲那些好笑的、温暖的、让人心安的。孩子们都叫你"故事爷爷"，你很喜欢这个名字。' },

    options: [
      { text: '准备后事', require: {}, effects: { 声望: 20, 道德: 10 }, narrative: '你平静地写好了遗嘱，见过了所有想见的人。在最后的时光里，每一顿饭都多嚼了几口，每一个拥抱都多持续了几秒。离去那天，你没有遗憾——你把所有的爱都留在了该留下的人身上。' },
      { text: '疯狂享乐', require: { 财富: 5000 }, effects: { 财富: -5000, 运气: 5 }, narrative: '"如果只剩下三个月，为什么不过得像三十岁？"你掏出积蓄，办了场连国王都羡慕的宴会。美酒、美食、美人——你活在当下，燃烧尽最后一分财富。有人说你糊涂，但你的笑声比任何反驳都有力量。你在狂欢中离去，如同蜡烛燃尽前的那一秒最明亮的火焰。' },
      { text: '寻找续命之法', require: { 智慧: 130 }, effects: { 体质: 10, 道德: -15 }, setFlag: 'immortality', narrative: '你一头扎进了禁忌的领域——不死之术、灵魂附体、时间的缝隙。你成功了——或者说，你以一种常人无法理解的方式成功了。你的脉搏还在跳动，但你的体温变得冰凉，你的影子有时候不会出现在该出现的地方。延寿的代价，你在余生中慢慢体会。' },

    id: 'narr_09', stages: ['中年', '中老年'], minAttr: {}, vision: '', difficulty: '',
    weight: 5, narrativeOnly: true, title: '旧物箱里的信',
    narrative: '你整理阁楼时翻出了一个布满灰尘的旧木箱。里面没有珠宝，没有装备，只有几封信、一张旧票根、一块碎掉的护身符、一条早已褪色的发带。你的手指慢慢滑过每一件东西，像是滑过岁月的纹路。你不确定自己是在回忆——还是在跟过去的自己说再见。最终你把箱子合上，但没有放回阁楼。你把它拿到了床头——让你每晚入睡前，都能看一眼。',
  },
  {
    id: 'narr_10', stages: ['老年'], minAttr: {}, vision: '', difficulty: '',
    weight: 6, narrativeOnly: true, options: [], title: '最后的春天',
    narrative: '这是你的不知第几个春天了。窗外的樱花开得铺天盖地，风一吹就落得到处都是。你拄着拐杖走到院子里，发现去年种的那棵小树苗已经比你高了。你摸了摸它的叶子，感觉它正在拼命吸收阳光和雨露——正如你年轻时那样拼命。你坐在树下的石凳上，闭上眼睛。春风拂过你的白发，像一个温柔的告别。也许不是告别——只是一种安静的陪伴。',
  },
  // ===== 扩展事件 =====
  { id: 'baby_05', stages: ['婴儿'], minAttr: {}, vision: '', difficulty: '', weight: 5, narrativeOnly: true, options: [], title: '满月宴', narrative: '家族为你办了热闹的满月宴。七大姑八大姨轮流抱你，你被传了一圈又一圈，脸上被亲了不知多少口。有人往你的襁褓里塞了红包，有人往你的额头上点了朱砂。你什么都不记得——但许多年后翻看老相册，看到那张全家福，你能从每个人的笑容里读出一个词：希望。' },
  { id: 'baby_06', stages: ['幼年'], minAttr: {}, vision: '', difficulty: '', weight: 5, narrativeOnly: true, options: [], title: '抓周', narrative: '一岁生日那天，大人们在桌上摆满了东西：一本书、一柄小木剑、一枚金币、一支笔。你被放在桌边，所有人屏住呼吸。你爬过金币，绕过木剑，在书和笔之间犹豫了很久——然后一把抓住了两样。奶奶笑得合不拢嘴："这孩子，文武双全！"' },
  { id: 'child_05', stages: ['童年', '幼年'], minAttr: {}, vision: '', difficulty: '', weight: 6, title: '小动物', narrative: '你在路边发现了一只受伤的小动物——毛茸茸的，蜷缩在草丛里瑟瑟发抖，用一双湿漉漉的眼睛看着你。你的心一下子软了。', options: [
    { text: '带回家养', require: {}, effects: { 道德: 5, 魅力: 3, 财富: -20 }, narrative: '你用零花钱给它买了药和食物。它慢慢康复了，成了你童年最好的伙伴。每天放学它都在门口等你，摇着尾巴冲过来。它教会了你什么是责任——也教会了你什么是无条件的爱。' },
    { text: '帮它找主人', require: {}, effects: { 魅力: 3, 道德: 3 }, narrative: '你挨家挨户地问，终于找到了它的主人——一位独居的老奶奶。她抱着它哭了。"这是我老伴留下的……"从那以后，你每隔几天就去探望他们，直到老奶奶把你当成了亲孙子。' },
  ]},
  { id: 'child_06', stages: ['童年'], minAttr: {}, vision: '', difficulty: '', weight: 5, title: '偷吃被抓', narrative: '厨房里飘出的香味像一只无形的手，把你从床上拽了起来。你踮着脚尖溜进厨房，伸手去够桌上那盘刚烤好的蜂蜜饼干。手指刚碰到饼干——"咳。"母亲站在门口，双臂交叉，眉毛挑得老高。', options: [
    { text: '老实认错', require: {}, effects: { 道德: 5, 魅力: 2 }, narrative: '"对不起，妈妈。"你低下头，把饼干放了回去。母亲愣了一下，然后笑了——她蹲下来抱了抱你，把整盘饼干都给了你。"诚实的孩子值得奖励。"你学到了一句真理：说真话有时候比偷吃更甜。' },
    { text: '编个借口', require: {}, effects: { 魅力: 3, 智慧: 2, 道德: -2 }, narrative: '"我……我听见厨房里有老鼠，来帮你看看！"你脸不红心不跳地编着。母亲看了你三秒，大笑起来。"老鼠？那你嘴里嚼的是什么？"你被罚洗了一周碗——但也学会了一个技能：撒谎的时候要先把嘴擦干净。' },
  ]},
  { id: 'youth_05', stages: ['少年'], minAttr: {}, vision: '', difficulty: '', weight: 6, title: '离家出走', narrative: '你和家里大吵了一架。原因已经不重要了——也许是不让你学剑，也许是逼你学经商，也许只是青春期的荷尔蒙在造反。总之你把几件衣服塞进包袱，在深夜翻窗而出。你觉得自己像小说里的侠客。', options: [
    { text: '第二天就回家了', require: {}, effects: { 道德: 3, 魅力: -2 }, narrative: '你在外面冻了一夜，饥肠辘辘，连一只野狗都欺负你。第二天早上你灰溜溜地回了家。母亲什么都没说，只是给你盛了一碗热粥。你喝着粥，觉得这是世界上最好吃的东西。' },
    { text: '坚持了一个月', require: { 体质: 40 }, effects: { 体质: 8, 敏捷: 5, 智慧: 3 }, narrative: '你在外面吃了不少苦——给商队搬货、在酒馆洗碗、跟流浪艺人学了两首歌。一个月后你回到家，晒黑了，也结实了。家人看你的眼神变了——不再是看个孩子，而是看一个能扛事的人。' },
  ]},
  { id: 'youth_06', stages: ['少年'], minAttr: {}, vision: '', difficulty: '', weight: 6, title: '地下竞技场', narrative: '有人在悄悄招募年轻人参加地下竞技——不打生死，只切磋，赢了有赏金。空气里弥漫着汗水和铁锈的味道，灯光昏暗，但观众的眼睛亮得吓人。你被推到了台前——对手是一个块头比你大一倍的少年。', options: [
    { text: '上台比试', require: { 力量: 40 }, effects: { 力量: 8, 财富: 100, 声望: -5 }, narrative: '你在擂台上挨了不少揍，但也揍了对方不少。三回合后裁判举起了你的手。观众席爆发出喝彩——还有一些人把赌注狠狠摔在了地上。你揣着赢来的金币走出地下室，虽然脸上还火辣辣地疼。' },
    { text: '拒绝', require: {}, effects: { 智慧: 3, 道德: 3 }, narrative: '你看了看擂台上的血迹，转身走了。有人在背后吹口哨嘲笑你。你没有回头。两年后你听说那个地下竞技场被卫兵查封了——老板用假药坑选手，好几个人被打成了终身残疾。你打了个冷噤。' },
  ]},
  { id: 'adult_05', stages: ['青年'], minAttr: {}, vision: '', difficulty: '', weight: 6, title: '远航招募', narrative: '港口停着一艘前所未见的大船——三桅的远洋帆船，目的地是传说中盛产香料的东方大陆。船长正在招募船员。"谁想看看世界尽头的模样？"他的喊声被海风吹散，但你的耳朵已经竖了起来。', options: [
    { text: '签下船员契约', require: {}, effects: { 敏捷: 8, 运气: 5, 财富: 300 }, narrative: '海上的生活比你想象中更艰苦——但也更壮丽。你见过鲸鱼跃出海面、暴风雨把船抛到三层楼高、日出时整个海面变成流动的金子。一年后你带着异域的货物和故事回来了。你的皮肤被海风磨粗了，但你的眼神比出海前亮了十倍。' },
    { text: '送别他们', require: {}, effects: { 魅力: 3 }, narrative: '你在港口站了很久，目送那艘船消失在海平面上。心里有那么一点后悔——但你还有自己的路要走。船出航后的第三个月，你听说它在风暴中差点沉了，死了三个水手。你想：也许明天出发也不迟。也许。' },
  ]},
  { id: 'adult_06', stages: ['青年'], minAttr: {}, vision: '', difficulty: '', weight: 6, title: '赏金猎人', narrative: '镇上公告栏贴着一张悬赏令：一个臭名昭著的土匪头子，悬赏八百金币。肖像画得很潦草，但奖金数额写得很清楚。你旁边也有人在盯着这张悬赏令——他们的手指都在不自觉地摸向武器。', options: [
    { text: '接下悬赏', require: { 力量: 65, 敏捷: 50 }, effects: { 力量: 8, 财富: 800, 声望: 20 }, narrative: '你追了那个土匪整整七天，在沼泽边缘截住了他。打斗很短暂——他的刀法粗糙，靠的是人多势众而不是真功夫。你把他捆回镇上时，整条街的人都出来看。赏金到手——但你看着铁窗里那个面黄肌瘦的人，忽然觉得他也许只是另一个走了岔路的可怜人。' },
    { text: '不参与', require: {}, effects: { 智慧: 3 }, narrative: '你把悬赏令从公告栏上撕下来，折好塞进口袋——不是去追，而是防止别人看到。然后你继续赶路。这种亡命之徒的活，留给那些没有选择的人吧。' },
  ]},
  { id: 'adult_07', stages: ['青年'], minAttr: {}, vision: '', difficulty: '', weight: 5, narrativeOnly: true, options: [], title: '王宫舞会', narrative: '你收到了一张请柬——也许是某个贵族欠你的人情，也许是某个你帮过的人记得你。总之你穿上最体面的衣服，走进了王宫的大理石舞厅。水晶吊灯像凝固的瀑布，小提琴手在角落里拉着忧伤的旋律，穿着丝绸长裙的女士们像五彩的鱼一样旋转。你在角落里端着一杯香槟，觉得自己像是一个误入了童话世界的乞丐。但没有人赶你走。有那么一瞬间——你觉得自己真的属于这里。' },
  { id: 'prime_05', stages: ['壮年'], minAttr: {}, vision: '', difficulty: '', weight: 6, title: '领地争端', narrative: '你的领土和邻接的领主发生了边界纠纷——双方都在边境上竖了界碑，每一方都声称自己是对的。农民们不敢在那片地上种庄稼了，因为不知道谁会来收税。剑拔弩张的气氛让人想起即将着火的干柴。', options: [
    { text: '谈判解决', require: { 魅力: 80 }, effects: { 声望: 25, 道德: 10, 魅力: 5 }, narrative: '你请对方领主来你的城堡喝了三天的酒。第三天晚上，你们在一张餐巾纸上画了一条双方都能接受的边界线。他走的时候拍了拍你的肩膀："下次你来我的地盘——带酒来。"战争避免了，而你多了一个盟友。' },
    { text: '武力威胁', require: { 力量: 100 }, effects: { 力量: 8, 声望: 15, 道德: -10 }, narrative: '你在边境集结了一支精锐部队，在界碑前进行了三天军事演习。对方领主派来一个使者——说话的时候声音都在抖。第二天界碑被移到了你指定的位置。你赢了——但边境上的农民从此看你的眼神里多了一层畏惧。' },
  ]},
  { id: 'prime_06', stages: ['壮年'], minAttr: {}, vision: '', difficulty: '', weight: 6, title: '伏击商队', narrative: '有人在酒馆里悄悄塞给你一张纸条：一支载满黄金的商队今晚会经过黑风谷，只带六个护卫。纸条上还有一行小字：「干一票，后半辈子不用愁。」你的手心出汗了。', options: [
    { text: '参与伏击', require: { 敏捷: 70 }, effects: { 财富: 3000, 道德: -25, 声望: -20 }, narrative: '你们在黑风谷设伏，商队几乎没有还手之力。黄金多得你一个人搬不动。但你那天晚上一夜没睡着——因为一个商队护卫临死前看了你一眼，那双眼睛像烙铁一样烫在你心里。此后你每次闭上眼睛，都能看到那双眼睛。' },
    { text: '告发伏击计划', require: {}, effects: { 声望: 20, 道德: 15 }, narrative: '你连夜找到了城卫队，把计划全盘托出。卫队长亲自带队埋伏在黑风谷——不过这次是伏击伏击者。第三天，你以"治安功臣"的身份被郡守亲自嘉奖。那个给你送纸条的人被绞死了——你看着他被吊起来时，心情极度复杂。' },
  ]},
  { id: 'prime_07', stages: ['壮年'], minAttr: {}, vision: '', difficulty: '', weight: 5, narrativeOnly: true, options: [], title: '建造城堡', narrative: '你买下了一片荒地，开始建造自己的城堡。第一块基石是你亲手放下的——一铲下去，泥土翻出新生的气息。工程持续了两年。石匠、木匠、玻璃匠轮流进场，脚手架拆了又搭。落成那天，你站在最高的塔楼上，看着夕阳把石墙染成金红色。这是你的家——不是继承的，不是租来的，是你一砖一瓦亲手建起来的。风吹过塔楼，像是这座城堡在轻轻地呼吸。而你站在它的心脏里。' },
  { id: 'prime_08', stages: ['壮年'], minAttr: {}, vision: 'hero', difficulty: '', weight: 10, title: '龙岩之战（愿景专属）', narrative: '一条成年红龙盘踞在龙岩山上，已经烧毁了三个村庄。国王发布了SS级紧急任务——任何能驱逐或击杀这条龙的冒险者，将获得世袭爵位和封地。你需要的一切——力量、声望、勇气——都已经积累了很久。今天，就是检验这一切的时刻。', options: [
    { text: '正面屠龙', require: { 力量: 130, 体质: 100 }, effects: { 力量: 15, 声望: 80, 体质: -10 }, setFlag: 'dragonSlayer', narrative: '你在龙岩山顶与红龙厮杀了整整一个上午。龙息把你的盾牌烧成了铁水，龙尾把你的肋骨扫断了三根。但你最终把剑刺进了它的心脏。巨大的身躯轰然倒下时，整个山谷都在震动。你浑身是血地站在龙尸上，天空下起了雨——把血和雨水混在一起，流进了山谷。整个王国都在传唱你的名字。' },
    { text: '智取', require: { 智慧: 110 }, effects: { 智慧: 10, 声望: 60 }, narrative: '你没有正面硬碰。你研究了龙的习性，在它外出觅食时潜入了洞穴，搬走了所有的龙蛋。你站在洞口等着红龙回来，把一个龙蛋高高举起。红龙和你对视了很久——然后低下了头。它带着蛋飞走了，再也没有回来。没有屠龙，但你救了三个村庄而不用流一滴龙血。这才是真正的勇者。' },
  ]},
  { id: 'mid_04', stages: ['中年'], minAttr: {}, vision: '', difficulty: '', weight: 6, title: '政变阴谋', narrative: '王国发生了政变——至少是未遂的。反对派试图推翻国王，在背后拉拢所有有影响力的人。你在他们的名单上——确切地说，在"必须争取"的那一栏，画了三个圈。两拨人都派了使者来见你。', options: [
    { text: '支持国王', require: {}, effects: { 声望: 30, 道德: 10 }, narrative: '你公开宣布效忠王座。政变被镇压后，国王在朝堂上亲自起立向你鞠了一躬。"在最黑暗的时刻，你是那盏没有熄灭的灯。"你在王国中的地位从此无人能动摇。' },
    { text: '保持中立', require: {}, effects: { 智慧: 5, 运气: -3 }, narrative: '你假装生病，闭门谢客整整两个月。政变失败了，但也没有人怪到你头上。你看着双方在你门前留下的密信，一把火烧了它们。有的时候，不站队本身就是一种站队——而站错队的人已经在牢里了。' },
  ]},
  { id: 'mid_05', stages: ['中年'], minAttr: {}, vision: '', difficulty: '', weight: 6, title: '瘟疫来袭', narrative: '一种未知的瘟疫从南方港口蔓延而来。感染者先是发烧，然后皮肤上出现黑色斑点，最后——通常在第七天——停止呼吸。城镇开始封路，人们躲在家里不敢出门。空气中飘着焚烧草药的苦涩气味。你看见城门口堆满了逃难者的行李。', options: [
    { text: '组织隔离和救治', require: { 声望: 150 }, effects: { 声望: 40, 道德: 20, 财富: -1000 }, narrative: '你打开了自己的仓库，把粮食和药材分发给病人。你请来了王国最好的医师，在城外搭建了临时隔离区。疫情持续了三个月——但因为你早期的果断行动，死亡率比别的城镇低了一半。人们不再叫你的名字——他们叫你"那盏灯"。' },
    { text: '封锁城门，自保为主', require: {}, effects: { 体质: 8, 道德: -10 }, narrative: '你下令将病人集中隔离在城墙外的一片荒地。里面有你的朋友、你的邻居、你的旧部。你看着他们被封在门外——有些人隔着城墙朝你喊话，你没有回应。疫情结束后，你活了下来。但你走过街道时，那些空无一人的屋子里，沉默比任何控诉都要响亮。' },
  ]},
  { id: 'mid_06', stages: ['中年'], minAttr: {}, vision: 'wealthy', difficulty: '', weight: 10, title: '垄断贸易（愿景专属）', narrative: '你掌握了大陆上最重要的贸易路线——连接东西方的唯一安全通道。现在你有两个选择：竞争，还是垄断。前者可能被超越，后者意味着所有竞争对手都会被你的体量碾碎。你的财富已经达到临界点——再往前走一步，整个市场的规则将由你来写。', options: [
    { text: '建立商业帝国', require: { 财富: 50000 }, effects: { 财富: 30000, 声望: 40, 道德: -15 }, setFlag: 'merchantKing', narrative: '你通过兼并收购，在三年内控制了整条贸易路线。所有商队都必须向你缴纳通行费，所有港口都必须挂你的旗帜。你坐在办公室里，看着地图上每一个被你的航线覆盖的港口，像一位国王看着自己的版图。你不是贵族——但你已经比大多数贵族都要富有十倍。' },
    { text: '开放竞争', require: {}, effects: { 声望: 20, 道德: 10, 财富: 5000 }, narrative: '你把通行费维持在了一个合理的水平，让小型商队也有生存空间。你的市场份额也许没有垄断那么高——但你的名字在整个商界被尊敬。没有人诅咒你，没有人密谋推翻你。有时候，名声比利润更值得投资。' },
  ]},
  { id: 'late_04', stages: ['中老年'], minAttr: {}, vision: '', difficulty: '', weight: 5, narrativeOnly: true, options: [], title: '退休计划', narrative: '你开始认真地想一个问题：退休之后做什么？在花园里种玫瑰？写一本回忆录？收养一只猫？你在纸上列了长长一串清单，然后又划掉了一大半。你忽然意识到——你从来没有学过如何"不做任何事"。你的手习惯了忙碌，你的脑习惯了计划，你的心习惯了追逐。也许退休的第一课，是允许自己什么都不做。你靠在椅背上，闭上眼睛，第一次尝试着不去想明天。' },
  { id: 'late_05', stages: ['中老年'], minAttr: {}, vision: '', difficulty: '', weight: 6, title: '皇家狩猎', narrative: '国王邀请你去皇家猎场——一片普通人一辈子都进不去的原始森林。秋季正是鹿群最肥美的时候，空气中弥漫着松针和泥土的味道。你骑着一匹栗色的猎马，腰间挂着弓，旁边是国王和他的亲卫队。', options: [
    { text: '猎一头雄鹿', require: { 敏捷: 70 }, effects: { 声望: 15, 敏捷: 5 }, narrative: '你屏住呼吸，拉开弓弦。箭矢穿过树林的间隙，正中目标。猎人们为你喝彩。国王亲自下马走过来，拍了拍你的肩膀："好身手！"晚上在篝火旁，你被安排坐在离国王最近的位置。' },
    { text: '享受自然', require: {}, effects: { 体质: 5, 道德: 5 }, narrative: '你把弓箭挂在马鞍上，只是骑着马在森林里穿行。秋天的树叶在阳光下像燃烧的金箔。你不需要证明什么了——能够在这样一个下午，安静地看一只鹿从你面前悠然走过，这本身就是一种特权。' },
  ]},
  { id: 'late_06', stages: ['中老年'], minAttr: {}, vision: 'sage', difficulty: '', weight: 10, title: '最后的公式（愿景专属）', narrative: '你的研究触及了魔法的终极命题——统一场论。如果能完成，你就可以用一个公式解释所有魔法现象。这是任何一位大法师都未曾做到的壮举。你的桌上堆满了草稿纸、用秃的羽毛笔、空了的墨水瓶。窗外天色从黑变白又从白变黑。你已经不记得今天是星期几了。', options: [
    { text: '完成公式', require: { 智慧: 160 }, effects: { 智慧: 20, 声望: 100 }, setFlag: 'grandSage', narrative: '你在一个下着暴雪的深夜写完了最后一行推导。你的手在发抖——不是因为冷，而是因为你意识到你完成了前人七百年都没能完成的事。你把公式写在一张羊皮纸上，签上自己的名字，然后趴在桌上睡着了——这是你三个月来第一次安稳的睡眠。第二天，整个魔法界为之震动。你的名字被写进了每一本魔法教科书的扉页。' },
    { text: '放弃，公式太危险', require: {}, effects: { 道德: 15, 智慧: 5 }, narrative: '你看着那张几乎完成的公式，沉默了很久。你忽然意识到——如果有人用这个公式，可以在一瞬间摧毁一座城市。你把所有草稿收起来，锁进一个只有你知道密码的保险柜。你没有成为名垂青史的大法师——但你保住了世界。而这一点，只有天知、地知、你知。' },
  ]},
  { id: 'old_05', stages: ['老年'], minAttr: {}, vision: '', difficulty: '', weight: 6, title: '神秘的预言', narrative: '来访者是一个你从未见过的女人，披着深紫色的斗篷。她自称来自未来——"不是比喻，是字面意思。"她说她在时间裂隙中看到过你的终点。"你想知道你是怎么死的吗？"她的眼睛没有任何感情——像两扇通往某个无尽深渊的窗户。', options: [
    { text: '听她说', require: {}, effects: { 智慧: 8, 运气: -3 }, narrative: '她低声在你耳边说了一句话。你的脸一下子白了。她没有再说什么，转身走入黑暗。从此你再也无法忘记那句话——而你也永远不会告诉任何人内容。有些秘密，就是用来带进坟墓的。' },
    { text: '拒绝聆听', require: {}, effects: { 运气: 5, 道德: 3 }, narrative: '"我不需要知道。"你打断了她。她微微一笑——笑容里有某种近似于赞赏的东西。"很好。大多数人是承受不了答案的。"她站起来，在出门前回头看了你一眼："你是少数人。保重。"然后她再也没出现过。' },
  ]},
  { id: 'old_06', stages: ['老年'], minAttr: {}, vision: '', difficulty: '', weight: 5, narrativeOnly: true, options: [], title: '最后的晚餐', narrative: '你把还活着的、还在联系的老朋友们都请到了家里。一共七个人，围着一张圆桌，几盘小菜，几瓶旧酒。你们聊了一整晚——聊年轻时的糗事，聊那些已经不在的人，聊世界变了多少。没有人提"最后一次"这个字眼，但每个人心里都清楚。散席时，大家站在门口互相看了很久，握手的时间都比平时长了一些。你目送他们走远，灯光一盏盏消失在夜色里。你关上门，对自己说：今晚是这些年来最好的一夜。' },
  { id: 'common_09', stages: ['青年', '壮年', '中年'], minAttr: {}, vision: '', difficulty: '', weight: 5, title: '驯服野兽', narrative: '你在野外遇见了一头受伤的猛兽——满身伤疤的灰色巨狼，一条后腿被捕兽夹咬得血肉模糊。它冲你龇着牙，喉咙里翻涌着低沉的咆哮。但它的眼睛里除了凶狠，还有另一种东西——也许是疲惫，也许是求生的本能。', options: [
    { text: '尝试救治', require: { 魅力: 60, 体质: 50 }, effects: { 魅力: 8, 力量: 5 }, setFlag: 'tamedBeast', narrative: '你花了整整一个月和这头巨狼建立信任。每天早上你放下肉，退到安全距离，等它来吃。第三十天——它没有对你咆哮。你伸出手，它用湿凉的鼻子碰了碰你的指尖。从那以后，它成了你最忠实的伙伴。再也没有人敢在深夜里靠近你的帐篷。' },
    { text: '给它解脱', require: {}, effects: { 力量: 3, 道德: -5 }, narrative: '你看着它的伤口——太深了，已经生了蛆。你拔出匕首，给了它一个快速的解脱。它甚至没有挣扎。站起来时，你的手在发抖——不是因为恐惧，而是因为你知道自己做了一件正确但不轻松的事。你把它的尸体埋在了溪边，用石头堆了一个小小的坟。' },
  ]},
  { id: 'common_10', stages: ['青年', '壮年', '中年'], minAttr: {}, vision: '', difficulty: '', weight: 5, title: '沙漠之旅', narrative: '你跟随一支骆驼商队穿越了被称为"焚骨之地"的大沙漠。白天的太阳像烙铁，夜晚的温度却让你裹着毯子还在发抖。第三天，你们迷路了——向导说指南针在这片沙漠里不管用，因为地下有一种奇怪的磁性矿石干扰方向。水已经不多了。', options: [
    { text: '根据星象导航', require: { 智慧: 70 }, effects: { 智慧: 8, 声望: 15 }, narrative: '你在魔法塔里读过一本关于天文导航的书——没想到会在这时候派上用场。你抬头看着夜空，认出了北十字星座。两天后，商队走出了沙漠。所有人都在沙地上对你磕头——他们认定了你是上天派来的救星。' },
    { text: '节约水源，等待救援', require: {}, effects: { 体质: 5, 运气: 5 }, narrative: '你把水分成最小份，让大家原地扎营。第六天，一支路过的游牧部落发现了你们。他们分享了自己的水和食物，把你们带到了绿洲。获救那天你喝了三碗骆驼奶——那是你一生中喝过最甜的东西。' },
  ]},
  { id: 'common_11', stages: ['少年', '青年', '壮年'], minAttr: {}, vision: '', difficulty: '', weight: 5, title: '地下交易', narrative: '有人在黑市上找你。"我听说你能搞到一般人搞不到的东西。"他递给你一张购物清单——上面全是违禁品：走私的魔法石、被教会禁止的炼金配方、一套据说能挡住任何刀剑的龙鳞盔甲。报酬是让你眼珠子都要掉出来的数字。', options: [
    { text: '接单去搞', require: { 敏捷: 70 }, effects: { 财富: 2500, 声望: -15, 道德: -10 }, narrative: '你花了三个月，辗转三个国家，在法律的灰色地带完成了这笔交易。钱到手了——但你也因此上了好几个组织的黑名单。以后每到一个新城市，你都先检查有没有便衣在跟踪你。这种日子很刺激，但也太累了。' },
    { text: '拒绝', require: {}, effects: { 道德: 8 }, narrative: '你把清单还给他。"你找错人了。"他盯着你看了几秒，然后走了。你后来听说有一个人接了这个单——两星期后他的尸体在港口被发现。你倒吸一口凉气。有些钱，不是用来赚的。' },
  ]},
  { id: 'common_12', stages: ['青年', '壮年', '中年'], minAttr: {}, vision: '', difficulty: '', weight: 5, title: '矿难救援', narrative: '远处的矿山忽然传来一声巨响——然后就是刺耳的警钟声。矿道塌了，三十多个矿工被困在地下。你不知道里面还有没有活人，但你知道每多等一分钟，生还的希望就少一分。已经有人开始往矿口跑，手里拿着铁锹和绳索。', options: [
    { text: '带队救援', require: { 体质: 70, 力量: 60 }, effects: { 声望: 35, 道德: 20, 体质: -5 }, narrative: '你戴上安全帽，点了火把，第一个钻进还在掉碎石的矿道。你们挖了整整六个小时，挖出了二十多个活人——有些人已经昏迷，有些人紧紧抱在一起。最后一个被救出来的是老矿长，他出来时不说一句话，只是握着你的手跪下了。你没有让他跪——你把他拉起来，给了他一个满是灰尘的拥抱。' },
    { text: '在外面协助', require: {}, effects: { 声望: 10, 道德: 5 }, narrative: '你不是矿工出身，没有下井的经验，但你在外面帮了大忙——组织临时医疗点、运送伤者、安抚家属。救援持续了一天一夜。最终统计：死了六个，活了二十四个。如果不是你的医疗点，活下来的可能只有二十个。那些被救的矿工每年都会给你寄一封信。' },
  ]},
  { id: 'extra_11', stages: ['青年', '壮年', '中年'], minAttr: {}, vision: '', difficulty: '', weight: 5, title: '河流游泳', narrative: '炎热的夏日，你路过一条清澈得能看见河底的溪流。一群村民正在水里嬉戏，笑声和泼水声交织在一起。你也脱掉靴子，把脚伸进冰凉的河水里。有人朝你泼了一捧水，你笑了——已经记不起上次这么放松是什么时候。', options: [
    { text: '跳下去一起玩', require: {}, effects: { 魅力: 5, 体质: 3 }, narrative: '你纵身一跃跳进了河里，溅起了巨大的水花。那一整个下午你什么都没想——没有明天的行程、没有未了的恩怨、没有需要做出的选择。就是水，阳光，笑声。这样的下午一辈子没有几个，所以你记住了每一个。' },
    { text: '坐在岸边看着', require: {}, effects: { 智慧: 3 }, narrative: '你微笑着坐在岸边，看别人在水里玩。不参与有它的乐趣——宁静、旁观、感受时间的流动。一个女孩从水里跑上来，递给你一个从河底捡的漂亮石子。"送你。"你接过来，放在手心里。它现在还放在你的书桌上。' },
  ]},
  { id: 'extra_12', stages: ['壮年', '中年', '中老年'], minAttr: {}, vision: '', difficulty: '', weight: 5, narrativeOnly: true, options: [], title: '午后的屋檐', narrative: '雨停了。你坐在屋檐下，看着水珠一滴一滴从瓦片的边缘滑落。空气里有雨后的青草味——那是一种让你想起童年的味道。隔壁院子里，有人在弹一把走了调的鲁特琴，音不准，但不知道为什么听着特别顺耳。一只流浪猫跳上你的膝盖，转了两圈，趴下了。你没有赶它走——你只是继续看着水滴。这样的午后什么也没发生。而这正是它最珍贵的地方。' },
  { id: 'extra_13', stages: ['中年', '中老年', '老年'], minAttr: {}, vision: '', difficulty: '', weight: 5, narrativeOnly: true, options: [], title: '博物馆的回声', narrative: '王都开了一家博物馆——大陆上第一家。你的某件战利品被放在了一个玻璃柜里，旁边写着你的名字。你站在人群里，看着一群孩子趴在玻璃上，眼睛亮晶晶地盯着看。一个男孩对同伴说："我以后也要成为这样的人。" 你低下头，笑了——笑着笑着眼眶有点酸。你不知道他会不会真的走上这条路。但你知道，有人因为你而梦想。这就够了。' },
  { id: 'extra_14', stages: ['老年'], minAttr: {}, vision: '', difficulty: '', weight: 5, narrativeOnly: true, options: [], title: '镜中人', narrative: '清晨洗漱时，你在镜子里看到了一个老人。花了大概三秒钟你才意识到——那就是你自己。你凑近镜子，仔细看着每一道皱纹。每一道纹路你都记得：这道是那年在暴风雪里冻出来的，这道是得知父亲去世时哭出来的，这道是你第一次开怀大笑时就有了的。你对着镜子里的自己点了点头——像是在跟一个老朋友打招呼。镜子里的你也点了点头。你们已经认识了一辈子。' },
  // ===== 第二波扩展 =====
  { id: 'baby_07', stages: ['婴儿', '幼年'], weight: 5, narrativeOnly: true, options: [], title: '摇篮曲', narrative: '每天晚上入睡前，母亲都会坐在你的摇篮边，哼唱一首古老的歌谣。你听不懂歌词——那是某种已经失传的语言——但旋律像温水一样包裹着你。很多很多年以后，你会在一个失眠的深夜忽然哼起这段旋律。你已经不记得歌词，不记得母亲的声音，但你还记得那种被深深爱着的感觉。' },
  { id: 'child_07', stages: ['童年', '幼年'], weight: 6, title: '风筝', narrative: '春天来了，你花了三天时间用竹条和废纸糊了一只风筝。第一次放飞时，它一头栽进了邻居家的烟囱。你不服，修好了又试——第三次它终于飞了起来，越飞越高，高到你看不清它的形状。你牵着线仰着头，觉得自己也能飞。', options: [
    { text: '比赛放风筝', require: {}, effects: { 敏捷: 3, 魅力: 3 }, narrative: '你和全村的孩子们组织了一场风筝比赛。你的风筝不是最高、也不是最漂亮的——但它在空中翻了一个所有人都没见过的跟头，拿了个"最佳特技奖"。你骄傲了整整一个夏天。' },
    { text: '独享这一刻', require: {}, effects: { 智慧: 3 }, narrative: '你不跟任何人比。你一个人躺在草地上，放着风筝，看云在蓝天里慢悠悠地飘。你不记得那天是什么日子——这不重要。重要的是，那是你童年里最安静、最完整的一个下午。' },
  ]},
  { id: 'child_08', stages: ['童年'], weight: 5, narrativeOnly: true, options: [], title: '外婆的故事', narrative: '外婆是你认识的所有人里最会讲故事的人。她讲的故事里，月亮是一艘银色的大船，星星是散落在海面上的钻石，而风是一位永远不停脚步的邮差。你趴在外婆的膝盖上，听她讲了一整个下午。外婆去世后，你把她的故事一个个写了下来。你没有她的才华——但你在每一页纸上，都闻到了她身上那股淡淡的桂花香。' },
  { id: 'youth_07', stages: ['少年'], weight: 6, title: '荒野求生', narrative: '你和几个朋友打了一个赌：谁能独自在野外生存七天？赌注是一枚金币。听起来不难——但第一晚的狼嚎就让你缩在睡袋里出了一身冷汗。你带的干粮第三天就吃完了，火折子被雨淋湿了，唯一的武器是一把钝了的水果刀。', options: [
    { text: '撑到了第七天', require: { 体质: 50 }, effects: { 体质: 8, 力量: 5, 智慧: 5 }, narrative: '你学会了用燧石生火、识别可食用浆果、用树枝搭避难所。第七天你走出森林时，瘦了三斤，但你的眼神变了——变得像一头年轻的狼。朋友们欢呼着把金币递给你，但你觉得，你得到的东西比金币值钱得多。' },
    { text: '第三天就放弃了', require: {}, effects: { 智慧: 3, 魅力: -2 }, narrative: '第三天的暴雨浇灭了你最后的斗志。你湿漉漉地回了村，被朋友们笑了一整个月。但你并不觉得丢人——因为你现在知道了自己的极限在哪里。下一次，你会准备得更充分。' },
  ]},
  { id: 'youth_08', stages: ['少年'], weight: 5, narrativeOnly: true, options: [], title: '第一把武器', narrative: '你用攒了半年的零花钱买到了人生中第一把真正的武器——不是什么神兵利器，只是一把普通的短剑，铁匠铺里最便宜的那把。剑柄有点歪，剑身上有一小块锈迹。但你不在乎。你把它挂在腰上，在镇上来回走了三圈，觉得全世界都在看你。晚上你把它放在枕头底下睡觉。多年以后你换了很多把武器，每一把都比这把好——但没有一把让你那样开心过。' },
  { id: 'adult_08', stages: ['青年'], weight: 6, title: '伪造文书', narrative: '有人出高价请你伪造一份贵族身份证明——有了它，一个平民就可以继承一笔本不属于他的遗产。文书上的每个字都可能是犯罪证据，但报酬足以让你三年不工作。', options: [
    { text: '接下活计', require: { 智慧: 70 }, effects: { 财富: 2000, 道德: -15, 声望: -10 }, narrative: '你花了两周查资料、仿印章、调墨水。成品几可乱真——连纸张都用了和真品同样年份的羊皮纸。钱如期到账了。你听说那个"假贵族"成功继承了家产，日子过得还不错。但你每次经过王都的档案馆都会加快脚步。' },
    { text: '举报给当局', require: {}, effects: { 声望: 15, 道德: 10 }, narrative: '你假装答应了，然后把所有证据交给了卫兵。那个委托人被逮捕时对你破口大骂——但几周后调查发现，这笔遗产本来就是他诈骗的一部分。你阴差阳错地破了一个连环案，还拿到了赏金。' },
  ]},
  { id: 'adult_09', stages: ['青年'], weight: 5, narrativeOnly: true, options: [], title: '深夜酒馆', narrative: '凌晨两点的酒馆里只剩下你、老板、和一个趴桌上睡着了的醉汉。老板一边擦杯子一边跟你聊——他以前是个水手，去过五十多个港口，最后被一个厨娘留在了这座内陆城市。他说他这辈子最骄傲的事，不是见过多少大海，而是每天晚上关店前把她做的那碗面吃完。你喝完最后一口酒，走出酒馆时天已经快亮了。你回头看了一眼那盏昏黄的灯——它像是一个承诺，承诺这世界上总有一个人在等着另一个人回家。' },
  { id: 'prime_09', stages: ['壮年'], weight: 6, title: '铸造传奇', narrative: '你收集了大陆上最稀有的材料——陨铁、龙鳞碎片、凤凰的尾羽。你找到了一位隐居多年的传奇铁匠，他看了你的材料沉默了很久，然后问："你打算造什么？"' , options: [
    { text: '造一把武器', require: { 力量: 100 }, effects: { 力量: 15, 声望: 30, 财富: 1500 }, setFlag: 'legendaryWeapon', narrative: '炉火烧了七天七夜。铁匠说你造的不是武器——是一个象征。那把剑出世时，剑身上的纹路像流动的岩浆。你在试剑时一剑劈开了三寸厚的铁板。铁匠拄着锤子看着你，眼睛里有泪光："我打了一辈子铁，这是最后一件。谢谢你让我带着它离开。"' },
    { text: '造一件防具', require: { 体质: 90 }, effects: { 体质: 15, 声望: 20 }, narrative: '你选择造一件胸甲——不为了攻击，为了守护。铁匠花了三个月，每一锤都像是在写诗。成品轻如羽毛，硬如龙鳞。你把胸甲穿在身上时，铁匠说："我希望你永远用不到它的全部本事——但如果要用到，它会护住你的心。"' },
  ]},
  { id: 'prime_10', stages: ['壮年'], weight: 5, narrativeOnly: true, options: [], title: '午夜的城墙', narrative: '轮到你值夜班巡逻城墙了。今晚没有月亮，只有火把在风里发出噼啪的响声。你在城墙上走了一圈又一圈，跟每一个哨兵点头致意。远方是黑暗的旷野——什么都没有，又像什么都有可能藏着。你在最高的塔楼上站了一会儿，看着这座你守护的城池安静地沉睡着。没有人知道你的名字，但此刻——你也不需要任何人知道。你抽了一口凉凉的夜风，紧了紧披风，觉得这种安静，值了。' },
  { id: 'mid_07', stages: ['中年'], weight: 6, title: '失踪的商队', narrative: '一支满载货物的商队在穿越山脉时失踪了——整整二十辆马车，价值连城的丝绸和香料，连人带货消失得无影无踪。商会悬赏三千金币寻找线索。有人说被山贼劫了，有人说是山体滑坡，还有人说是——别的什么东西。', options: [
    { text: '带队调查', require: { 敏捷: 80, 智慧: 70 }, effects: { 智慧: 8, 财富: 1500, 声望: 20 }, narrative: '你在雪山上走了三天，最终在一个隐秘的峡谷裂缝中找到了商队——不是被劫，是被困。一场雪崩封住了唯一的出口，商队已经在里面困了两周。你带人凿开积雪，把所有人和货都活着带了回来。商会的感谢信镶在你的墙上，但你觉得更应该被感谢的是——运气。再晚三天，他们就没吃的了。' },
    { text: '派出探子', require: { 财富: 500 }, effects: { 财富: -500, 声望: 10 }, narrative: '你没有亲自去——但你花钱请了当地最好的猎人和向导。他们找到了一个幸存的车夫，他正独自一人往山下走，已经走了四天。根据他的描述，商队被困在了一个被雪埋住的峡谷里。你用最快的速度组织了救援——出钱，也是出力的一种方式。' },
  ]},
  { id: 'mid_08', stages: ['中年'], weight: 5, narrativeOnly: true, options: [], title: '酒窖里的尘', narrative: '你在自家酒窖里翻出了一瓶积满灰尘的旧酒——标签已经看不清了，但瓶身完好。你拔开瓶塞，酒香瞬间充满了整个地窖。你忽然想起来：这是三十年前，你的父亲埋下去的。他说等他老了再喝。他没能等到那一天。你倒了一杯，放在父亲的照片前。然后自己倒了一杯，坐在地窖的台阶上慢慢喝。酒很烈，像父亲的脾气。你想：爸，我没法替你喝这杯——我只能陪你喝这杯。' },
  { id: 'late_07', stages: ['中老年'], weight: 6, title: '外交调停', narrative: '两个邻国之间的摩擦已经持续了十年。边境上的小规模冲突越来越频繁，全面战争一触即发。出乎所有人的意料，两国国王同时指名要你来当调停人——一个非贵族、非外交官出身的普通人。这在大陆外交史上是前所未有的。', options: [
    { text: '主持和平谈判', require: { 声望: 400, 魅力: 100 }, effects: { 声望: 80, 道德: 20, 财富: 3000 }, narrative: '你在谈判桌上坐了一个月。第一周双方还在互相拍桌子，第二周开始松动，第三周你提出了一个双方都不完全满意但都能接受的方案，第四周——条约签了。十年僵局，一个月解开。你走出谈判厅时，外面聚集了上千人，他们不需要翻译——他们看到你在笑着摇头，就知道和平来了。' },
    { text: '拒绝，不在其位', require: {}, effects: { 智慧: 5 }, narrative: '你写了一封诚恳的婉拒信，推荐了一位你认识的退休法官。"我不是外交官，我只是一个见过一些世面的普通人。但他——他是专业的。"你推荐的法官成功完成了调停。有时候，最聪明的做法就是让更合适的人上场。' },
  ]},
  { id: 'late_08', stages: ['中老年'], weight: 5, narrativeOnly: true, options: [], title: '冬夜的炉火', narrative: '整个村子被大雪封住了。没人进出，也没人着急。你坐在壁炉前，膝盖上盖着一条旧毯子——那是你母亲织的。炉火烧得旺旺的，木柴偶尔发出一声清脆的爆裂。你手里端着一杯热可可，旁边放着一本读了一半的书。窗外在下雪——很大的雪。但你不在意。今晚你有一本书、一杯热饮、一堆温暖的柴火。这就是你年轻时无法理解的那种幸福。现在你懂了。' },
  { id: 'old_07', stages: ['老年'], weight: 6, title: '王朝的请求', narrative: '新登基的年轻国王亲自登门拜访你——不是以国王的身份，而是以一个焦虑年轻人的身份。他在王座上坐了不到三个月，就已经感受到了来自四面八方的压力。"你是怎么挺过来的？"他问。他看起来比你当年第一次上战场时还要年轻。', options: [
    { text: '倾囊相授', require: { 声望: 300 }, effects: { 声望: 50, 道德: 15 }, narrative: '你和他聊了整整一个下午。不是以导师的姿态，而是以一个同样迷茫过的过来人。你告诉他你犯过的最大错误、你后悔过的最大决定、你最想对年轻时自己说的话。他走的时候握了你的手很久——那双眼睛里的焦虑少了一些，多了某种东西：也许叫坚定。他后来成了一位好国王——你从未公开说那是你的功劳，但你知道。' },
    { text: '给几句建议就走', require: {}, effects: { 智慧: 5 }, narrative: '"做个好人，"你拍了拍他的肩膀，"剩下的自己悟。"你觉得自己有点不近人情，但你也知道——真正的王者，不应该依赖任何人的指点。那个年轻人后来在历史上被称为"自学之王"。你每次听到这个名号就忍不住笑。' },
  ]},
  { id: 'old_08', stages: ['老年'], weight: 5, narrativeOnly: true, options: [], title: '银杏树下', narrative: '院子里那棵银杏树又黄了。满地的金黄叶子铺得像地毯一样厚。你坐在树下，看着叶子一片一片地落下来。有人说银杏是最古老的树——它的祖先见过恐龙。你忽然觉得，如果一棵树能活那么久，也许它什么都见过、什么都知道，只是不能说。你把手放在粗糙的树皮上，像是握了一位老朋友的手。风吹过来，整棵树在沙沙作响——也许它在回答你，只是你用了一辈子才学会听懂。' },
  { id: 'common_13', stages: ['青年', '壮年', '中年', '中老年'], weight: 5, title: '过路的诗人', narrative: '一个流浪诗人路过你的门口，问能不能借一晚住。他的吉他背上刻满了去过的地方的名字——有些你听过，有些你连发音都不会。他问你讨一碗水，你给了他水和面包，他回赠了你一首诗。', options: [
    { text: '留他住一晚，听他唱歌', require: {}, effects: { 魅力: 5, 运气: 3 }, narrative: '那一晚你在自家院子里点了一小堆篝火，听他弹琴唱歌。他的嗓音沙哑，有些地方还跑了调，但每一首歌都有一个故事——关于一个远方、一段爱情、一次离别。他走的时候在墙上用炭笔画了一朵小花。"当作房租。"你一直没擦掉它——那是你这辈子收到过最便宜、也最珍贵的房租。' },
    { text: '给他指路就走', require: {}, effects: { 智慧: 2 }, narrative: '你指了指通往驿站的路。"往前走，有条岔路右拐，有家客栈。"他笑着点了点头，背着吉他在夕阳里越走越远。你忽然觉得——他也许是某位流浪的神明，专门为那些有屋顶的人提醒一件事：世界很大，而你已经很久没有出发了。' },
  ]},
  { id: 'common_14', stages: ['少年', '青年', '壮年'], weight: 5, title: '绣球招亲', narrative: '一个富贵人家在广场上搭起了高台——他家的小姐到了出嫁的年纪，正在举办传统的抛绣球招亲。广场上挤满了年轻男子，热闹得像过节。你本来只是路过，却被朋友一把推了进去。绣球在空中划了一道弧线——朝你的方向飞来。', options: [
    { text: '伸手接住', require: { 魅力: 50 }, effects: { 魅力: 5, 财富: 500, 声望: 10 }, narrative: '绣球不偏不倚地落在你怀里。全场都在看你。那位小姐在台上掩着嘴笑了——看起来很开心的样子。你们最终并没有在一起——但你因为这个契机认识了她的父亲，一位大商人，后来成了你最重要的生意伙伴。缘分这东西，不一定通向爱情。' },
    { text: '赶紧躲开', require: {}, effects: { 敏捷: 5 }, narrative: '你一个侧身闪开了——绣球砸在了你身后一个满脸通红的铁匠学徒身上。他后来娶了那位小姐，据说过得非常美满。你每次看到他们一家人在集市上散步，心里都有一种奇怪的感觉：你躲开的不是一个绣球——而是一条完全不同的人生轨迹。' },
  ]},
  { id: 'common_15', stages: ['壮年', '中年', '中老年'], weight: 5, title: '御前比武', narrative: '王国每逢大庆典，都会举办御前比武——全大陆最优秀的战士聚集在国王面前一决高下。今年的头奖是一把王家锻造的大马士革剑。你不需要更多的荣誉了——但你是战士，身体里的每一个细胞都在告诉你：上台。', options: [
    { text: '重出江湖', require: { 力量: 110, 体质: 90 }, effects: { 力量: 10, 声望: 35 }, narrative: '你在擂台上面对的都是年轻人——更快、更狂、更不知天高地厚。但你的经验无人能及。你在决赛里用了一招十年没使过的老招式，在最后一刻反败为胜。全场起立。国王从王座上站起来，把剑递给你时，低声说："不是给你的——是借给你的，等你老到拿不动了，还给我。"你笑着接过了剑。' },
    { text: '当观众', require: {}, effects: { 智慧: 3, 魅力: 2 }, narrative: '你坐在国王旁边，一边喝着免费的葡萄酒，一边看年轻人互相厮杀。旁边有个老将军跟你差不多年纪，你们相视一笑——那种笑里有理解：我们都不需要再证明什么了。看着擂台上的热血沸腾，你一点都不羡慕。你羡慕的是他们还能打得动。' },
  ]},
  { id: 'chain_inherit_01', stages: ['青年', '壮年'], requireFlag: 'guild', excludeFlag: 'guildElite', weight: 8, title: '公会日常：带新人', narrative: '公会安排你带一个刚入会的菜鸟——一个连剑都拿不稳的少年，眼神里全是青涩和不自量力。你看着他，像看见了多年前的自己。真受不了——但你也知道，当年带你的那个老兵，看你的眼神大概也是一样的。', options: [
    { text: '认真带他', require: {}, effects: { 魅力: 8, 道德: 5 }, narrative: '你花了一个月手把手教他——不是只教剑法，还教他怎么读任务公告、怎么跟委托人打交道、怎么在酒馆里不被骗钱。他后来成了一把好手。每次有人夸他，他都说："我师父教得好。"而他的师父——就是你。' },
    { text: '让他自己悟', require: {}, effects: { 力量: 3 }, narrative: '"摔了跟头才知道疼。"你只给他最基本的指导，剩下的让他自己去撞。他确实吃了不少苦头——第一次任务就挂彩，第二次被委托人骗了一百金币。但他学得很快。三个月后，他已经不用你操心了。摔着摔着就长大了——跟你当年一样。' },
  ]},
  { id: 'chain_merchant_01', stages: ['壮年', '中年'], requireFlag: 'bigInvestor', weight: 8, title: '跨国商会', narrative: '几家大商会的代表找上了你——他们想联合成立一个跨国贸易联盟，统一关税、共享航道、互相保障安全。这是你从未见过的格局：不是在单一市场里竞争，而是把整个大陆变成一个自由贸易区。他们想让你——当年那个砸锅卖铁的赌徒——担任联盟的首任主席。', options: [
    { text: '出任联盟主席', require: { 声望: 300, 财富: 20000 }, effects: { 声望: 50, 财富: 10000, 魅力: 8 }, setFlag: 'tradeKing', narrative: '你在联盟的就职典礼上只说了一句话："我三十年前口袋里只有三个铜板。"全场安静了三秒钟——然后响起了雷鸣般的掌声。他们不是在为一个富人鼓掌，而是在为一个可能鼓掌。每一个口袋里只有三个铜板的年轻人，今晚都睡得比平时更踏实了一点。' },
    { text: '当普通股东', require: {}, effects: { 财富: 3000, 运气: 3 }, narrative: '你觉得当主席太出风头了——枪打出头鸟。你投了一笔钱入股，安安静静地当了个股东。联盟运作得很成功——而你在幕后享受分红，不用出席任何无聊的董事会。这笔买卖，你觉得比当年赌船运香料那次还要划算。' },
  ]},
  { id: 'chain_dragon_01', stages: ['中年', '中老年'], requireFlag: 'dragonSlayer', weight: 12, title: '屠龙者的孤独', narrative: '自从屠了那条红龙之后，人们看你的眼神变了。他们不再和你勾肩搭背地喝酒，不再在集市上随便拍你的肩膀。你被邀请去各种正式场合——但没有人邀请你去街边的大排档了。你是英雄。英雄是不能蹲在马路牙子上吃烤串的——这是不成文的规矩。你开始怀疑，那条龙并没有被你杀死——它只是变成了另一种东西：一座围绕你的无形牢笼。', options: [
    { text: '保持普通人身份', require: {}, effects: { 魅力: 10, 道德: 5 }, narrative: '你做了一个出人意料的决定：你把龙牙卖了，把钱捐给了那三个被焚烧的村庄。然后你在公众面前宣布——屠龙者今天退休。第二天你穿着普通人的衣服走进了酒馆，所有人都愣了一秒——然后最粗犷的那个老兵吼了一声："请屠龙者喝一杯！"你被淹没在啤酒和笑声里。你知道——你回来了。' },
    { text: '接受英雄身份', require: { 声望: 400 }, effects: { 声望: 40, 魅力: 5, 道德: -5 }, narrative: '你接受了命运的安排。你在各种典礼上被人举杯致敬，你的画像被挂在冒险者公会的大厅，你的名字被写进了教科书。但每个深夜，当你独自坐在空荡荡的大厅里时，你会想起那条龙临死前的眼睛——那里面没有愤怒，只有某种你不敢承认的东西：也许是理解。你理解那条龙。这才是最让你害怕的。' },
  ]},
  { id: 'extra_15', stages: ['青年', '壮年', '中年'], weight: 5, narrativeOnly: true, options: [], title: '雨中的驿站', narrative: '一场突如其来的大暴雨把你困在了荒郊野外的驿站。屋里只有一个老驿卒、一只正在打呼噜的猫和一壶煮了又煮的浓茶。你靠在窗边看着外面的雨幕，雨水敲在瓦片上的声音像是一首不太整齐的打击乐。老驿卒往你的杯子里添了茶，没有说话。你们就这样安静地坐了一整个下午——两个陌生人，因一场大雨而共享了几个小时的宁静。雨停后你付了茶钱。走出门时，老驿卒在身后说了一句："慢走，路上小心。"你不认识他，他也不认识你。但这就是善良——不需要理由。' },
  { id: 'extra_16', stages: ['壮年', '中年', '中老年'], weight: 5, narrativeOnly: true, options: [], title: '信鸽归来', narrative: '一只信鸽扑棱着翅膀落在你的窗台——脚环上系着的信筒已经生锈了。你取下里面的纸条，发现这是一封二十年前发出的信。发信人是你自己。信上只写了一行字："如果你撑过了接下来的十年，请回信给我。" 你盯着那行字看了很久。然后你找了张新纸，在上面写："撑过了。比想象中难，也比想象中值得。谢谢你当年没有放弃。——二十年前的你。" 你系好信筒，放飞了鸽子。不指望它送到。但你只是想——对当年的自己说一声谢谢。' },
];

function saveProgress() {
  const progress = {
    difficulty: state.difficulty,
    rhythm: state.rhythm,
    race: state.race,
    identity: state.identity,
    vision: state.vision,
    talents: state.talents,
    attrs: { ...state.attrs },
    stageIndex: state.stageIndex,
    completedEvents: [...state.completedEvents],
    currentEvents: state.currentEvents.map(e => e.id),

  };
  try {

}

function saveEnding() {
  const record = {

    race: RACES[state.race]?.name || state.race,
    identity: (IDENTITIES[state.race] || []).find(i => i.id === state.identity)?.name || state.identity,
    vision: VISIONS.find(v => v.id === state.vision)?.name || state.vision,
    difficulty: DIFFICULTIES[state.difficulty]?.name || state.difficulty,

    talents: state.talents.map(tid => TALENTS.find(t => t.id === tid)?.name || tid),
    finalAttrs: { ...state.attrs },
    title: getEndingTitle(),
    score: calculateScore(),
    narrative: generateNarrative(),
    deathType: state.deathType,
    deathCause: state.deathCause,
    visionDone: checkVisionComplete(),
    timestamp: Date.now(),
  };
  try {
    // 战绩上报云端：score = 结局等级数字（S=5...D=1，越大越好）
    const scoreMap = { S: 5, A: 4, B: 3, C: 2, D: 1 };

}

function renderScreenWrapper(title, subtitle, content) {
  return `<div class="screen-content">
    <h2>${title}</h2>
    <p class="subtitle">${subtitle}</p>
    ${content}
  </div>`;
}

function formatAttrChanges(bonuses) {
  if (!bonuses) return '';
  return Object.entries(bonuses).filter(([, v]) => v !== 0).map(([k, v]) => {
    const cls = v > 0 ? 'tag-positive' : 'tag-negative';
    const sign = v > 0 ? '+' : '';
    return `<span class="tag ${cls}">${k} ${sign}${v}</span>`;
  }).join(' ');
}

// 天赋抽取
function drawTalents(count, negativeBias) {
  const goodTalents = TALENTS.filter(t => t.type !== 'cursed');
  const cursedTalents = TALENTS.filter(t => t.type === 'cursed');
  let pool = [];
  const negCount = negativeBias ? Math.min(count - 1, cursedTalents.length) : 0;
  const posCount = count - negCount;
  pool = shuffle([...goodTalents]).slice(0, Math.max(1, posCount))
    .concat(shuffle([...cursedTalents]).slice(0, negCount));
  return shuffle(pool);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getTalentTypeLabel(type) {
  const labels = { legendary: '传说', epic: '史诗', rare: '稀有', cursed: '诅咒' };
  return labels[type] || type;
}

function shareGame() {

  // Generate card on offscreen canvas
  const canvas = document.createElement('canvas');
  canvas.width = 1200; canvas.height = 1600;
  const ctx = canvas.getContext('2d');
  const W = 1200, H = 1600, gold = '#c9a84c';

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
    ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
    ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
    ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r); ctx.closePath();
  }

  ctx.fillStyle = '#0d0d0d'; ctx.fillRect(0, 0, W, H);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1a1a2e'); bg.addColorStop(1, '#0d0d0d');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = 0.06;
  [{x:200,y:400,r:280},{x:1000,y:300,r:180},{x:1050,y:1200,r:320},{x:150,y:1300,r:160},{x:600,y:200,r:100}].forEach(d => {
    ctx.fillStyle = gold; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 0.25; ctx.fillStyle = gold;
  for (let i = 0; i < 40; i++) { ctx.beginPath(); ctx.arc(80+Math.random()*(W-160), 80+Math.random()*(H-160), 1+Math.random()*2, 0, Math.PI*2); ctx.fill(); }
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#1a1a2e';
  ctx.shadowColor = 'rgba(201,168,76,0.15)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 8;
  rr(ctx, 90, 220, W-180, H-560, 40); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = 'rgba(201,168,76,0.3)'; ctx.lineWidth = 2;
  rr(ctx, 90, 220, W-180, H-560, 40); ctx.stroke();

  ctx.strokeStyle = gold; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(200, 120); ctx.lineTo(W-200, 120); ctx.stroke();

  ctx.fillStyle = gold; ctx.font = "bold 88px 'Times New Roman', 'Songti SC', serif"; ctx.textAlign = 'center';
  ctx.fillText('人生重开模拟器', W/2, 390);
  ctx.font = '80px sans-serif'; ctx.fillText('🧝  🐉  ⚔️  🧙  🛡️  🌑', W/2, 530);
  ctx.fillStyle = '#888'; ctx.font = "42px -apple-system, 'PingFang SC', sans-serif";

  ctx.strokeStyle = '#3a3520'; ctx.lineWidth = 2; ctx.setLineDash([14, 10]);
  ctx.beginPath(); ctx.moveTo(200, 720); ctx.lineTo(W-200, 720); ctx.stroke(); ctx.setLineDash([]);

  ctx.fillStyle = '#aaa'; ctx.font = "36px -apple-system, 'PingFang SC', sans-serif";
  ['🧬  五大种族，暗黑奇幻世界观', '🎴  天赋抽卡，传说史诗诅咒', '⚔️  四种难度，大逆风到龙傲天', '📖  四十个丰富人生事件', '🏆  多重结局，SS~D 评分'].forEach((f, i) => ctx.fillText(f, W/2, 820+i*88));

  ctx.fillStyle = gold; ctx.font = "italic 34px 'Times New Roman', 'Songti SC', serif";
  ctx.fillText('— 每一次选择，都是新的人生 —', W/2, 1310);

  // Draw QR then show overlay
  const qrImg = new Image(); qrImg.crossOrigin = 'anonymous';
  qrImg.onload = () => {
    const qs = 260, qx = (W-qs)/2, qy = H-370;

    ctx.strokeStyle = gold; ctx.lineWidth = 2; rr(ctx, qx-24, qy-24, qs+48, qs+48, 32); ctx.stroke();
    ctx.drawImage(qrImg, qx, qy, qs, qs);
    ctx.fillStyle = '#666'; ctx.font = "26px -apple-system, 'PingFang SC', sans-serif";
    ctx.fillText('扫码或长按识别 · 开启暗黑奇幻人生', W/2, H-40);
    showOverlay(canvas);
  };
  qrImg.onerror = () => { showOverlay(canvas); };
  qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=' + encodeURIComponent(SHARE_URL) + '&margin=8';

function rerollTalents() {
  if (state.remainingRerolls <= 0) return;
  state.remainingRerolls--;
  const diff = DIFFICULTIES[state.difficulty];
  state.drawnTalents = drawTalents(diff.drawCount, diff.negativeBias);
  state.selectedTalents = [];

  state.allocPoints = diff.allocPoints;
  applyBaseAttributes();

function applyBaseAttributes() {
  state.attrs = { 力量: 10, 智慧: 10, 魅力: 10, 敏捷: 10, 体质: 10, 运气: 10, 财富: 100, 声望: 0, 道德: 0 };
  const diff = DIFFICULTIES[state.difficulty];
  const race = RACES[state.race];
  const identity = IDENTITIES[state.race].find(i => i.id === state.identity);

  Object.entries(race.bonuses).forEach(([k, v]) => {
    if (state.attrs[k] !== undefined) state.attrs[k] += v;
  });

  if (identity && identity.bonuses) {
    Object.entries(identity.bonuses).forEach(([k, v]) => {
      if (state.attrs[k] !== undefined) state.attrs[k] += v;
    });
  }

  state.talents.forEach(tid => {
    const talent = TALENTS.find(t => t.id === tid);
    if (talent) {
      Object.entries(talent.effects).forEach(([k, v]) => {
        if (state.attrs[k] !== undefined) state.attrs[k] += v;
      });
    }
  });

  ['力量','智慧','魅力','敏捷','体质','运气'].forEach(k => {
    state.attrs[k] = Math.max(1, Math.round(state.attrs[k] * diff.attrMultiplier));
  });

  state.attrs.财富 = Math.max(0, state.attrs.财富);
}

      `).join('')}

    <button class="btn primary" onclick="confirmAlloc()">开始人生</button>
  `);
}

function adjustAttr(attr, delta) {
  if (delta > 0 && state.allocPoints <= 0) return;
  if (delta < 0) {
    state.allocPoints++;
    state.attrs[attr] -= 2;
  } else {
    state.allocPoints--;
    state.attrs[attr] += 2;
  }
  render();
}

function confirmAlloc() {
  state.stageIndex = 0;
  state.completedEvents = [];
  state.screen = 'lifeEvent';
  saveProgress();
  render();
}
// === Event Engine ===

function filterEvents(stageName) {
  const diff = DIFFICULTIES[state.difficulty] || DIFFICULTIES.normal;
  const vision = VISIONS.find(v => v.id === state.vision);

  let candidates = EVENTS.filter(e => {
    if (!e.stages.includes(stageName)) return false;
    if (state.completedEvents.includes(e.id)) return false;
    if (e.difficulty) {
      const allowedDiffs = e.difficulty.split(',');
      if (!allowedDiffs.includes(state.difficulty)) return false;
    }
    if (e.minAttr && Object.keys(e.minAttr).length > 0) {
      for (const [k, v] of Object.entries(e.minAttr)) {
        if ((state.attrs[k] || 0) < v) return false;
      }
    }
    if (e.requireFlag && !state.storyFlags[e.requireFlag]) return false;
    if (e.excludeFlag && state.storyFlags[e.excludeFlag]) return false;
    return true;
  });

  if (diff.eventBias === 'negative') {
    const deadly = candidates.filter(e => e.options && e.options.some(o => o.death));
    const normal = candidates.filter(e => !e.options || !e.options.some(o => o.death));
    candidates = shuffle([...deadly, ...deadly, ...normal]);
  } else if (diff.eventBias === 'lucky') {
    const lucky = candidates.filter(e => e.options && e.options.some(o => (o.effects.财富 || 0) > 500));
    const normal = candidates.filter(e => !e.options || !e.options.some(o => (o.effects.财富 || 0) > 500));
    candidates = shuffle([...lucky, ...lucky, ...normal]);
  } else if (diff.eventBias === 'positive') {
    candidates = shuffle(candidates.filter(e => !e.options || !e.options.some(o => o.death)));
  }

  const visionEvents = candidates.filter(e => e.vision === state.vision);
  const otherEvents = candidates.filter(e => e.vision !== state.vision);
  candidates = shuffle([...visionEvents, ...visionEvents, ...otherEvents]);

  // 事件链优先 — 由之前选择触发的后续事件权重 ×4
  const chainEvents = candidates.filter(e => e.requireFlag);
  const nonChainEvents = candidates.filter(e => !e.requireFlag);
  candidates = shuffle([...chainEvents, ...chainEvents, ...chainEvents, ...chainEvents, ...nonChainEvents]);

  const weighted = [];
  candidates.forEach(e => {
    for (let i = 0; i < (e.weight || 10); i++) weighted.push(e);
  });
  const shuffled = shuffle(weighted);
  const rhythmKey = state.rhythm || 'standard';
  const baseCount = rhythmKey === 'compact' ? 2 : 2; // 精简每阶段2个，标准每阶段2个
  const count = Math.min(baseCount, shuffled.length);
  const picked = [];
  const seen = new Set();
  for (const e of shuffled) {
    if (picked.length >= count) break;
    if (!seen.has(e.id)) {
      seen.add(e.id);
      picked.push(e);
    }
  }
  return picked;
}

function renderLifeEvent(app) {
  const stages = (RHYTHMS[state.rhythm] || RHYTHMS.standard).stages;
  const stageName = stages[state.stageIndex];
  const isLastStage = state.stageIndex >= stages.length - 1;

  if (state.currentEvents.length === 0) {
    state.currentEvents = filterEvents(stageName);
  }

  const progressPct = ((state.stageIndex) / stages.length) * 100;

  // 瀑布流：历史事件 + 当前事件
  let html = `<div class="screen-content" id="waterfall">
    <h2>${isLastStage ? '🌅 ' : '🎭 '}${stageName}</h2>
    <div class="stage-info">
      <span>阶段 ${state.stageIndex + 1}/${stages.length}</span>
      <span>${state.difficulty && DIFFICULTIES[state.difficulty] ? DIFFICULTIES[state.difficulty].icon + ' ' + DIFFICULTIES[state.difficulty].name : ''}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>`;

  // 渲染历史事件（已完成的选择）
  state.eventLog.forEach(log => {
    html += `<div style="margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #1a1a2e;">
      <div style="font-size:11px;color:#666;margin-bottom:4px;">${log.stage} · ${log.title}</div>
      <div class="narrative" style="font-size:13px;margin-bottom:8px;">"${log.narrative}"</div>
      <div style="background:#1a1a2e;border-left:3px solid #c9a84c;padding:10px 14px;border-radius:4px;margin-bottom:6px;">
        <span style="color:#c9a84c;font-size:13px;">▸ ${log.chosenText}</span>
        ${log.effects ? `<span style="font-size:11px;color:#888;margin-left:8px;">${log.effects}</span>` : ''}
      </div>
      <p style="font-size:12px;color:#999;font-style:italic;">${log.result}</p>
    </div>`;
  });

  // 当前事件区域（加 id 用于焦点跟随）
  html += '<div id="currentEvent">';

  // 缓冲加载：覆盖当前区域，只显示因果推演，不预渲染下一事件
  if (state.loadingNext) {
    html += `<div style="text-align:center;padding:40px 16px;animation:fadeIn 0.3s;">
      <div style="display:inline-block;width:32px;height:32px;border:3px solid #1a1a2e;border-top-color:#c9a84c;border-radius:50%;animation:causalSpin 1s linear infinite;margin-bottom:16px;"></div>
      <p style="color:#c9a84c;font-family:'Times New Roman',serif;font-size:16px;letter-spacing:2px;">AI 正在推演命运…</p>
      <p style="color:#555;font-size:12px;margin-top:8px;animation:causalPulse 2s ease-in-out infinite;">
        ${['正在计算你每一个选择的涟漪效应…',
           '因果链正在重组，世界线重新计算中…',
           '命运的神经网络正在寻找最优路径…',
           '蝴蝶效应模型中，请稍候…',
           '正在遍历千万条时间线，寻找属于你的那条…',
           '多维度因果矩阵正在加权推演…',
           '命运的概率云正在坍缩为确定的故事…'][Math.floor(Math.random() * 7)]}
      </p>
    </div>`;
  } else if (state.currentEvents.length === 0) {
    html += `
      <div class="narrative" style="border-left-color:#555;margin-bottom:16px;">
        ${getStageSummary(stageName)}
      </div>
      <button class="btn primary" id="nextStageBtn" onclick="nextStage()">${isLastStage ? '走向结局' : '进入下一阶段'}</button>`;
  } else {
    const event = state.currentEvents[0];

    let causalBanner = '';
    if (event.requireFlag) {
      const reasons = getCausalReason(event.requireFlag);
      causalBanner = `<div style="font-size:12px;color:#c9a84c;margin-bottom:8px;opacity:0.7;">↳ ${reasons}</div>`;
    }

    // 天赋关联提示
    const talentHint = getTalentRelevance(event);

    if (event.narrativeOnly) {
      html += `
        ${causalBanner}
        <div class="narrative" style="border-left-color:#c9a84c;">"${event.narrative}"</div>
        ${talentHint}
        <button class="btn primary" onclick="completeNarrativeEvent()">继续</button>`;
    } else {
      const anyUnlocked = event.options.some(opt => checkOptionRequirement(opt));
      html += `
      ${causalBanner}
      <div class="narrative">"${event.narrative}"</div>
      ${talentHint}
      ${event.options.map((opt, i) => {
        const canChoose = checkOptionRequirement(opt);
        const cls = canChoose ? '' : 'locked';
        return `
          <div class="option-item ${cls}" ${canChoose ? `onclick="chooseEventOption(${i})"` : ''}>
            <div class="option-text">${String.fromCharCode(65 + i)}. ${opt.text}
              ${!canChoose ? '<span class="tag tag-locked">🔒</span>' : ''}
              ${opt.death ? '<span class="tag tag-negative">⚠ 致命</span>' : ''}
            </div>
            <div class="option-effects">
              ${formatOptionEffects(opt.effects)}
              ${!canChoose && opt.require ? `<span style="color:#666;">需要 ${Object.entries(opt.require).map(([k,v]) => `${k} ≥ ${v}`).join('，')}</span>` : ''}
            </div>
          </div>`;
      }).join('')}
      ${!anyUnlocked ? `
        <div class="option-item" onclick="skipCurrentEvent()">
          <div class="option-text">😔 无法应对 — 硬着头皮撑过去</div>
          <div class="option-effects"><span class="effect-neg">体质 -5</span> · <span class="effect-neg">运气 -3</span></div>
        </div>
      ` : ''}`;
    }
  }

  html += '</div>'; // #currentEvent

  html += `<div style="margin-top:16px;font-size:11px;color:#555;border-top:1px solid #1a1a2e;padding-top:8px;margin-bottom:40px;">
    力量 ${state.attrs.力量} · 智慧 ${state.attrs.智慧} · 魅力 ${state.attrs.魅力} · 敏捷 ${state.attrs.敏捷} · 体质 ${state.attrs.体质} · 运气 ${state.attrs.运气} | 财富 ${state.attrs.财富} · 声望 ${state.attrs.声望} · 道德 ${state.attrs.道德}
  </div>`;

  html += '</div>';
  app.innerHTML = html;

  // 平滑滚动到当前事件
  setTimeout(() => {
    const current = document.getElementById('currentEvent');
    if (current) {
      current.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }, 200);
}

function checkOptionRequirement(opt) {
  if (!opt.require) return true;
  for (const [k, v] of Object.entries(opt.require)) {
    if ((state.attrs[k] || 0) < v) return false;
  }
  return true;
}

function formatOptionEffects(effects) {
  return Object.entries(effects).map(([k, v]) => {
    const sign = v > 0 ? '+' : '';
    let cls = 'effect-neutral';
    if (v > 0) cls = 'effect-pos';
    if (v < 0) cls = 'effect-neg';
    return `<span class="${cls}">${k} ${sign}${v}</span>`;
  }).join(' · ');
}

function chooseEventOption(idx) {
  const event = state.currentEvents[0];
  const option = event.options[idx];
  if (!checkOptionRequirement(option)) return;

  Object.entries(option.effects).forEach(([k, v]) => {
    if (state.attrs[k] !== undefined) {
      state.attrs[k] += v;
      if (['力量','智慧','魅力','敏捷','体质','运气'].includes(k)) {
        state.attrs[k] = Math.max(1, Math.min(200, state.attrs[k]));
      }
      if (k === '财富') state.attrs[k] = Math.max(0, Math.min(999999, state.attrs[k]));
      if (k === '声望') state.attrs[k] = Math.max(0, Math.min(1000, state.attrs[k]));
      if (k === '道德') state.attrs[k] = Math.max(-100, Math.min(100, state.attrs[k]));
    }
  });

  state.completedEvents.push(event.id);
  if (option.setFlag) state.storyFlags[option.setFlag] = true;
  if (event.setFlag) state.storyFlags[event.setFlag] = true;

  // 记录到瀑布流历史
  const stages = RHYTHMS[state.rhythm]?.stages || RHYTHMS.standard.stages;
  state.eventLog.push({
    stage: stages[state.stageIndex], title: event.title, narrative: event.narrative,
    chosenText: option.text, result: option.narrative || '',
    effects: Object.entries(option.effects).filter(([,v]) => v !== 0).map(([k,v]) => `${k} ${v > 0 ? '+' : ''}${v}`).join(' · '),
  });

  state.currentEvents.shift();

  if (option.death) {
    state.screen = 'ending';
    state.deathCause = option.deathNarrative || '你的旅途在此终结。';
    state.deathType = 'accident';
    saveEnding();
    clearProgress();
    render();
    return;
  }

  if (checkVisionComplete()) {
    state.screen = 'ending';
    state.deathType = 'vision';
    state.deathCause = '你完成了此生的使命！';
    saveEnding();
    clearProgress();
    render();
    return;
  }

  if (state.attrs.道德 >= 100 || state.attrs.道德 <= -100) {
    state.screen = 'ending';
    state.deathType = 'special';
    state.deathCause = state.attrs.道德 >= 100 ? '你的善行感化了整个大陆。' : '你已堕入深渊，再无回头之路。';
    saveEnding();
    clearProgress();
    render();
    return;
  }
  if (state.attrs.财富 <= 0) {
    state.screen = 'ending';
    state.deathType = 'special';
    state.deathCause = '你身无分文，在一个寒冷的冬夜静静睡去。';
    saveEnding();
    clearProgress();
    render();
    return;
  }

  saveProgress();
  transitionWithLoading();
}

// 统一的缓冲过渡：模拟因果推演过程
function transitionWithLoading() {
  state.loadingNext = true; render();
  const delay = 1000 + Math.random() * 2000; // 1-3秒随机
  setTimeout(() => { state.loadingNext = false; render(); }, delay);
}

// 根据叙事标记生成因果衔接文本
function getCausalReason(flag) {
  const map = {
    guild: '因为那年春天，你选择了加入冒险公会',
    guildElite: '自从你晋升为公会精英',
    mage: '因为你走上了魔法之路',
    mageElite: '从魔法试炼中脱颖而出的你',
    firstLove: '多年后的某一天，那段青涩的感情有了回响',
    bigInvestor: '因为当年你赌上一切的那笔投资',
    warHero: '自从你在战场上立下赫赫战功',
    darkKnowledge: '因为你触碰了不该触碰的知识',
    darkMaster: '当你越走越深，黑暗不再是黑暗',
    immortality: '因为你选择了超越死亡',
    savedLives: '因为你曾用双手救回生命',
    tookContract: '从那个神秘委托开始',
    legendaryHero: '完成了传奇任务的你，已经是活着的传说',
    archmage: '触摸过时间的大法师，看到了别人看不到的东西',
    general: '从士兵一步步走到将军的你',
  };
  return map[flag] || '';
}

// 天赋-事件关联：检查玩家天赋，为事件添加个性化描述
function getTalentRelevance(event) {
  const talentNames = state.talents.map(tid => TALENTS.find(t => t.id === tid)).filter(Boolean);
  if (talentNames.length === 0) return '';

  // 根据事件内容匹配相关天赋
  const relevant = [];
  talentNames.forEach(t => {
    const e = t.effects;
    // 力量相关事件 + 力量天赋
    if ((event.title.includes('武') || event.title.includes('战') || event.title.includes('剑') || event.title.includes('角斗') || event.title.includes('决斗')) && e.力量 > 0) {
      relevant.push(`你「${t.name}」的天赋让你在这场较量中占得先机。`);
    }
    // 智慧事件 + 智慧天赋
    if ((event.title.includes('魔法') || event.title.includes('学') || event.title.includes('书') || event.title.includes('知识') || event.title.includes('试炼')) && e.智慧 > 0) {
      relevant.push(`「${t.name}」让你比常人更快地理解眼前的一切。`);
    }
    // 魅力事件 + 魅力天赋
    if ((event.title.includes('爱') || event.title.includes('重逢') || event.title.includes('演说') || event.title.includes('社交')) && e.魅力 > 0) {
      relevant.push(`你身上「${t.name}」的光环让周围的人不自觉地被吸引。`);
    }
    // 运气事件
    if ((event.title.includes('奇遇') || event.title.includes('馅饼') || event.title.includes('占卜')) && e.运气 > 0) {
      relevant.push(`「${t.name}」似乎在这时悄悄发挥了作用。`);
    }
    // 体质
    if ((event.title.includes('暴风雨') || event.title.includes('冒险') || event.title.includes('征途')) && e.体质 > 0) {
      relevant.push(`「${t.name}」赐予你的坚韧之躯此刻格外可靠。`);
    }
  });

  if (relevant.length === 0) return '';
  const pick = relevant[Math.floor(Math.random() * relevant.length)];
  return `<div style="font-size:12px;color:#c9a84c;margin-bottom:8px;font-style:italic;">✨ ${pick}</div>`;
}

function completeNarrativeEvent() {
  const event = state.currentEvents[0];
  state.completedEvents.push(event.id);
  if (event.setFlag) state.storyFlags[event.setFlag] = true;
  const stages = RHYTHMS[state.rhythm]?.stages || RHYTHMS.standard.stages;
  state.eventLog.push({
    stage: stages[state.stageIndex], title: event.title, narrative: event.narrative,
    chosenText: '——', result: '你继续前行。', effects: '',
  });
  state.currentEvents.shift();
  saveProgress();
  transitionWithLoading();
}

function skipCurrentEvent() {
  const event = state.currentEvents[0];
  state.completedEvents.push(event.id);
  const stages = RHYTHMS[state.rhythm]?.stages || RHYTHMS.standard.stages;
  state.eventLog.push({
    stage: stages[state.stageIndex], title: event.title, narrative: event.narrative,
    chosenText: '硬着头皮撑过去', result: '你付出了代价，但活了下来。', effects: '体质 -5 · 运气 -3',
  });
  state.currentEvents.shift();
  state.attrs.体质 = Math.max(1, state.attrs.体质 - 5);
  state.attrs.运气 = Math.max(1, state.attrs.运气 - 3);
  saveProgress();
  transitionWithLoading();
}

function nextStage() {
  try {
    const rhythmKey = state.rhythm || 'standard';
    const stages = RHYTHMS[rhythmKey] ? RHYTHMS[rhythmKey].stages : RHYTHMS.standard.stages;
    if (state.stageIndex >= stages.length - 1) {
      state.screen = 'ending';
      state.deathType = 'natural';
      state.deathCause = '你在平静中走完了自己的一生。';
      saveEnding();
      clearProgress();
      state.loadingNext = false; render();
      return;
    }
    state.stageIndex++;
    state.currentEvents = [];
    saveProgress();
    transitionWithLoading();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="screen-content" style="text-align:center;padding-top:60px;">
      <h2 style="color:#c41e3a;">加载失败</h2><p style="color:#888;">${e.message}</p>
      <button class="btn primary" onclick="startNewGame()" style="margin-top:24px;">重新开始</button></div>`;
  }
}

function checkVisionComplete() {
  const vision = VISIONS.find(v => v.id === state.vision);
  if (!vision) return false;
  for (const [k, v] of Object.entries(vision.condition)) {
    if ((state.attrs[k] || 0) < v) return false;
  }
  return true;
}
// === Scoring ===

function calculateScore() {
  const sixAttrs = ['力量', '智慧', '魅力', '敏捷', '体质', '运气'];
  const avg = sixAttrs.reduce((s, k) => s + state.attrs[k], 0) / sixAttrs.length;
  if (avg >= 160) return 'SS';
  if (avg >= 130) return 'S';
  if (avg >= 100) return 'A';
  if (avg >= 70) return 'B';
  if (avg >= 40) return 'C';
  return 'D';
}

function getAttrGrade(val) {
  if (val >= 180) return { grade: 'SS', cls: 'score-SS' };
  if (val >= 150) return { grade: 'S', cls: 'score-S' };
  if (val >= 120) return { grade: 'A', cls: 'score-A' };
  if (val >= 80)  return { grade: 'B', cls: 'score-B' };
  if (val >= 40)  return { grade: 'C', cls: 'score-C' };
  return { grade: 'D', cls: 'score-D' };
}

function getEndingTitle() {
  const grade = calculateScore();
  if (state.deathType === 'vision') {
    const vision = VISIONS.find(v => v.id === state.vision);
    return vision ? vision.name : '命运之子';
  }
  const titles = { SS: '传奇不朽', S: '时代之光', A: '人中龙凤', B: '平凡之路', C: '坎坷一生', D: '悲剧人生' };
  return titles[grade] || '无人知晓';
}

function generateNarrative() {
  const vision = VISIONS.find(v => v.id === state.vision);
  const parts = [];

  if (state.deathType === 'accident') {
    parts.push(state.deathCause);
  } else if (state.deathType === 'natural') {
    const rhythmStages = (RHYTHMS[state.rhythm] || RHYTHMS.standard).stages;
    parts.push('你在' + rhythmStages[rhythmStages.length - 1] + '安然离世。');
  } else if (state.deathType === 'vision') {
    parts.push('你完成了「' + (vision ? vision.name : '未知') + '」的愿景！');
  } else {
    parts.push(state.deathCause || '你的故事到此结束。');
  }

  if (vision && checkVisionComplete()) {
    parts.push('此生无憾矣。');
  } else if (vision) {
    parts.push('可惜你未能完成「' + vision.name + '」的愿景。');
  }

  if (state.attrs.财富 > 50000) parts.push('你留下了巨额财富。');
  if (state.attrs.声望 > 500) parts.push('你的名字被世人铭记。');
  if (Math.abs(state.attrs.道德) > 80) {
    parts.push(state.attrs.道德 > 0 ? '人们称你为圣者。' : '人们惧怕你的名字。');
  }

  return parts.join(' ');
}

function renderEnding(app) {
  const grade = calculateScore();
  const title = getEndingTitle();
  const vision = VISIONS.find(v => v.id === state.vision);
  const visionDone = checkVisionComplete();
  const sixAttrs = ['力量', '智慧', '魅力', '敏捷', '体质', '运气'];

  app.innerHTML = `<div class="screen-content">
    <div class="ending-header">
      <div style="font-size:14px;color:#666;margin-bottom:8px;">${(DIFFICULTIES[state.difficulty]||{}).icon||''} ${(DIFFICULTIES[state.difficulty]||{}).name||''} · ${(RHYTHMS[state.rhythm]||{}).name||''}</div>
      <div class="ending-title">「${title}」</div>
      <div class="ending-grade">${grade}</div>
      <div style="font-size:14px;color:#c9a84c;">综合评分</div>
    </div>

    <div class="ending-narrative">
      <p>"${generateNarrative()}"</p>
    </div>

    <div style="margin-bottom:20px;">
      <h3>📊 属性评定</h3>
      ${sixAttrs.map(k => {
        const g = getAttrGrade(state.attrs[k]);
        return `
          <div class="attr-row">
            <span class="attr-name">${k}</span>
            <span style="font-size:14px;color:#ccc;">${state.attrs[k]}</span>
            <span class="score-badge ${g.cls}">${g.grade}</span>
          </div>`;
      }).join('')}
    </div>

    <div style="margin-bottom:20px;">
      <h3>🏛️ 社会成就</h3>
      <div class="attr-row">
        <span class="attr-name">财富</span>
        <span style="color:#ccc;">${state.attrs.财富.toLocaleString()} 金币</span>
      </div>
      <div class="attr-row">
        <span class="attr-name">声望</span>
        <span style="color:#ccc;">${state.attrs.声望}</span>
      </div>
      <div class="attr-row">
        <span class="attr-name">道德</span>
        <span style="color:${state.attrs.道德 >= 0 ? '#4caf50' : '#f44336'};">${state.attrs.道德 >= 0 ? '+' : ''}${state.attrs.道德}</span>
      </div>
    </div>

    <div style="margin-bottom:20px;">
      <h3>🌟 愿景</h3>
      <p>
        ${vision ? vision.icon + ' ' + vision.name + ' ' : ''}
        <span style="color:${visionDone ? '#4caf50' : '#f44336'};">
          ${visionDone ? '✅ 已完成' : '❌ 未完成'}
        </span>
      </p>
    </div>

    <button class="btn primary" onclick="startNewGame()">再来一局</button>
    <button class="btn" onclick="viewHistory()">生平回顾</button>
    <button class="btn-share" onclick="shareGame()">📤 分享给朋友</button>
    <button class="btn secondary" onclick="state.screen='title';render();" style="margin-top:16px;">返回标题</button>
  </div>`;
}

async function renderHistory(app) {
  const history = await loadHistory();

  app.innerHTML = `<div class="screen-content">
    <h2>📜 生平回顾</h2>
    <p class="subtitle">${history.length === 0 ? '还没有任何记录' : `共 ${history.length} 条人生记录`}</p>
    ${history.length === 0 ? `
      <div style="text-align:center;padding:40px 0;">
        <p style="font-size:48px;margin-bottom:16px;">📖</p>
        <p style="color:#666;">开始你的第一局游戏吧</p>
      </div>
    ` : history.map(h => `
      <div class="history-item">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="history-title">「${h.title}」</span>
          <span class="score-badge score-${h.score}">${h.score}</span>
        </div>
        <div class="history-meta">
          ${h.race} · ${h.identity} · ${h.difficulty} · ${h.rhythm}
        </div>
        <div class="history-meta">
          愿景：${h.vision} ${h.visionDone ? '✅' : '❌'} | ${new Date(h.timestamp).toLocaleDateString('zh-CN')}
        </div>
        <p style="font-size:12px;color:#888;margin-top:4px;font-style:italic;">"${h.narrative}"</p>
      </div>
    `).join('')}
    <button class="btn secondary" onclick="state.screen='title';render();">返回标题</button>
  </div>`;
}

// Initialize（硬登录门：未登录不能玩）
GamePlatform.init();
GamePlatform.mountGate({ gameId: 'life-restart-simulator' }).then(() => {
  GamePlatform.mountBar(document.getElementById('gp-bar'), { gameId: 'life-restart-simulator' });
  GamePlatform.mountLeaderboard(document.getElementById('gp-leaderboard'), { gameId: 'life-restart-simulator' });
  render();
});
</script>
